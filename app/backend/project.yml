name: Decksmith
options:
  bundleIdPrefix: com.deepak
  deploymentTarget:
    macOS: "14.0"
targets:
  Decksmith:
    type: application
    platform: macOS
    sources:
      - Sources/Decksmith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepak.decksmith
        PRODUCT_NAME: Decksmith
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Decksmith
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
